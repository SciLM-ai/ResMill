[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resmill"
version = "0.1.3"
description = "Rule-based 3D geological reservoir modeling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Ilgar Baghishov", email = "il.baghishov@gmail.com"},
    {name = "Elnara Rustamzade", email = "el.rustamzade@gmail.com"},
]
keywords = ["geology", "reservoir-modeling", "geoscience", "subsurface", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.57",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/SciLM-ai/ResMill"
Repository = "https://github.com/SciLM-ai/ResMill"

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter"]
dataset = ["pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["resmill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
